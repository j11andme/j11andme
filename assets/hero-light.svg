<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">j11andme — Agent 应用工程、内容工作流与计算机视觉</title>
  <desc id="d">资料横幅：左侧姓名与方向，右侧一颗发光恒星与三条倾斜轨道，行星沿轨道运行。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FEFC" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="blob">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.30" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunCore">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.45" stop-color="#6EE7B7" />
      <stop offset="1" stop-color="#10B981" />
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="0.55" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="1" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E7FAF2" stroke-width="1" />
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="26" /></clipPath>
  </defs>
  <style>
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 3.6s ease-in-out infinite; }
    @keyframes halo { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { .halo { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#surface)" />
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.85" />
    <ellipse cx="990" cy="150" rx="250" ry="200" fill="url(#blob)" />

    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3.2" fill="#047857">你好，我是</text>
    <text x="64" y="146" font-family="Inter, 'Segoe UI', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="700" letter-spacing="-0.5" fill="#0F172A">j11andme</text>
    <rect x="66" y="166" width="56" height="4" rx="2" fill="url(#accent)" />
    <text x="64" y="212" font-family="Inter, 'Segoe UI', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="21" fill="#3D4C5A">Agent 应用工程 · 内容工作流 · 计算机视觉</text>
    <text x="64" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#64748B">Java · Python · PyTorch · Vue · Docker</text>

    <g>
      <circle class="halo" cx="990" cy="150" r="46" fill="url(#sunGlow)" />
      <circle cx="990" cy="150" r="19" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="990" cy="150" r="12" fill="url(#sunCore)" />
    </g>

    <ellipse cx="990" cy="150" rx="78" ry="32" fill="none" stroke="#10B981" stroke-opacity="0.34" stroke-width="1.1" />
    <circle r="5" fill="#047857">
      <animateMotion dur="13s" repeatCount="indefinite" path="M912,150 a78,32 0 1,0 156,0 a78,32 0 1,0 -156,0" />
    </circle>

    <ellipse cx="990" cy="150" rx="134" ry="55" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.1" stroke-dasharray="4 9" />
    <circle r="7" fill="#10B981">
      <animateMotion dur="23s" repeatCount="indefinite" path="M856,150 a134,55 0 1,0 268,0 a134,55 0 1,0 -268,0" />
    </circle>

    <ellipse cx="990" cy="150" rx="188" ry="77" fill="none" stroke="#10B981" stroke-opacity="0.1" stroke-width="1.1" />
    <circle r="4" fill="#6EE7B7">
      <animateMotion dur="37s" repeatCount="indefinite" path="M802,150 a188,77 0 1,0 376,0 a188,77 0 1,0 -376,0" />
    </circle>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="25" fill="none" stroke="#D1FAE5" stroke-width="1.5" />
</svg>
