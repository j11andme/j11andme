<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">j11andme — Agent 应用工程、内容工作流与计算机视觉</title>
  <desc id="d">资料横幅：左侧姓名与技术方向，右侧为青绿柔光色团背景，色团缓慢漂移。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FEFC" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.97" />
      <stop offset="0.40" stop-color="#FFFFFF" stop-opacity="0.62" />
      <stop offset="0.74" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E7FAF2" stroke-width="1" />
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="26" /></clipPath>
    <radialGradient id="m0">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#6EE7B7" stop-opacity="0.248" />
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="m1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="0.55" stop-color="#34D399" stop-opacity="0.180" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="m2">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28" />
      <stop offset="0.55" stop-color="#2DD4BF" stop-opacity="0.126" />
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="m3">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.5" />
      <stop offset="0.55" stop-color="#A7F3D0" stop-opacity="0.225" />
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .drift { animation: drift 34s ease-in-out infinite alternate; }
    .drift-b { animation-duration: 46s; animation-direction: alternate-reverse; }
    .drift-c { animation-duration: 58s; }
    @keyframes drift { from { transform: translate(0px, 0px); } to { transform: translate(-26px, 18px); } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#surface)" />
    <ellipse class="drift" cx="1020" cy="10" rx="380" ry="260" fill="url(#m0)" />
    <ellipse class="drift drift-b" cx="1190" cy="250" rx="320" ry="220" fill="url(#m1)" />
    <ellipse class="drift drift-c" cx="690" cy="285" rx="340" ry="210" fill="url(#m2)" />
    <ellipse class="drift" cx="880" cy="100" rx="280" ry="190" fill="url(#m3)" />
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.5" />
    <rect width="1200" height="300" fill="url(#fade)" />

    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3.2" fill="#047857">你好，我是</text>
    <text x="64" y="146" font-family="Inter, 'Segoe UI', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="700" letter-spacing="-0.5" fill="#0F172A">j11andme</text>
    <rect x="66" y="166" width="56" height="4" rx="2" fill="url(#accent)" />
    <text x="64" y="212" font-family="Inter, 'Segoe UI', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="21" fill="#3D4C5A">Agent 应用工程 · 内容工作流 · 计算机视觉</text>
    <text x="64" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#64748B">Java · Python · PyTorch · Vue · Docker</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="25" fill="none" stroke="#D1FAE5" stroke-width="1.5" />
</svg>
