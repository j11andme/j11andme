<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">j11andme — Agent 应用工程、内容工作流与计算机视觉</title>
  <desc id="d">资料横幅：左侧姓名与方向，右侧同心信号环与脉冲核心。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B211C" />
      <stop offset="1" stop-color="#071A16" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#047857" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <radialGradient id="blob">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.22" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#112E27" stroke-width="1" />
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="26" /></clipPath>
  </defs>
  <style>
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 3.4s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    @keyframes halo { 0%, 100% { opacity: .14; transform: scale(1); } 50% { opacity: .36; transform: scale(1.55); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .halo, .spin { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#surface)" />
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.85" />
    <ellipse cx="990" cy="118" rx="250" ry="200" fill="url(#blob)" />

    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3.2" fill="#6EE7B7">你好，我是</text>
    <text x="64" y="146" font-family="Inter, 'Segoe UI', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="700" letter-spacing="-0.5" fill="#EAF7F2">j11andme</text>
    <rect x="66" y="166" width="56" height="4" rx="2" fill="url(#accent)" />
    <text x="64" y="212" font-family="Inter, 'Segoe UI', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="21" fill="#B9D6CC">Agent 应用工程 · 内容工作流 · 计算机视觉</text>
    <text x="64" y="248" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8FB3A9">Java · Python · PyTorch · Vue · Docker</text>

    <g fill="none" stroke="#34D399">
      <circle cx="990" cy="150" r="52" stroke-width="1.6" opacity="0.5" />
      <circle cx="990" cy="150" r="96" stroke-width="1.4" opacity="0.3" />
      <circle cx="990" cy="150" r="140" stroke-width="1.2" opacity="0.15" />
    </g>
    <circle class="spin" cx="990" cy="150" r="118" fill="none" stroke="#047857"
            stroke-width="1.6" stroke-dasharray="5 12" stroke-linecap="round" opacity="0.55" />
    <g fill="#34D399">
      <circle cx="906.9" cy="198.0" r="5" />
      <circle cx="1073.1" cy="198.0" r="5" />
      <circle cx="990.0" cy="54.0" r="5" />
    </g>
    <circle class="halo" cx="990" cy="150" r="20" fill="#34D399" />
    <circle cx="990" cy="150" r="9" fill="url(#accent)" />
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="25" fill="none" stroke="#14532D" stroke-width="1.5" />
</svg>
